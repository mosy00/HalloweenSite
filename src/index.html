<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A Halloween trial: prove yourself worthy of the key, solve the sliding puzzle, and continue the journey." />
  <meta name="theme-color" content="#0a060a" />
  <title>The Worthy Key — A Halloween Trial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="backdrop-grain" aria-hidden="true"></div>
  <canvas id="aura-canvas" aria-hidden="true"></canvas>
  <div id="pointer-aura" aria-hidden="true"></div>
  <div class="gate-container">
    <!-- Section 1: Hero -->
    <header class="hero" aria-label="Welcome">
      <p class="hero-eyebrow">A Halloween gathering &middot; by invitation of the worthy</p>
      <h1>The key is worthy only of intelligent people</h1>
      <p class="journey-line">Find it to continue the journey</p>
      <a class="scroll-cue" href="#trial" aria-label="Scroll down to the puzzle trial">
        <span class="scroll-cue__label">Descend to the trial</span>
        <svg class="scroll-cue__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 9 L12 17 L20 9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </header>

    <!-- Section 2: The trial (puzzle gate, then form, then confirmation) -->
    <main class="trial" id="trial" aria-label="The trial">
      <p class="trial-eyebrow" aria-hidden="true">The Trial of the Key</p>

      <!-- Puzzle container (shown on puzzle step) -->
      <section class="puzzle-container" id="puzzle" role="region" aria-label="Sliding key puzzle">
      <canvas id="puzzle-canvas" width="300" height="300" role="img" aria-label="3x3 sliding tile puzzle"></canvas>
    </section>

    <!-- Registration form container (shown on form step) -->
    <section class="form-container" id="form" hidden role="region" aria-label="Registration form">
      <form id="registration-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required minlength="1" aria-required="true" />
          <span class="error" id="name-error" role="alert"></span>
        </div>
        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required pattern="[\\d\\s\\+\-\(\)]{7,}" aria-required="true" />
          <span class="error" id="phone-error" role="alert"></span>
        </div>
        <div class="field">
          <label for="discountCode">Discount Code</label>
          <input type="text" id="discountCode" name="discountCode" required minlength="3" aria-required="true" />
          <span class="error" id="discountCode-error" role="alert"></span>
        </div>
        <button type="submit" id="next-btn" class="next-btn">Next</button>
      </form>
    </section>

    <!-- Confirmation container (shown on confirmation step) -->
    <section class="confirmation-container" id="confirmation" hidden role="region" aria-label="Confirmation">
      <h2 class="door-message" id="door-message">The door is open now</h2>
      <p class="confirmation-text">Thank you for registering. Your details are saved.</p>
    </section>
    </main>
  </div>

  <script type="module" src="ts/main.ts"></script>
</body>
</html>
